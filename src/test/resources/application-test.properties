spring.datasource.url=jdbc:h2:mem:estate_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,TRANSACTION,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false

jwt.secretKey=test-secret-key-for-tests-only-0123456789012345678901234567890123456789
jwt.signerKey=test-signing-key-for-hs512-012345678901234567890123456789012345678901234567890123456789
jwt.valid-duration=3600
jwt.refreshable-duration=86400

outbound.identity.client-id=test-client-id
outbound.identity.client-secret=test-client-secret
outbound.identity.redirect-uri=http://localhost:9095/auth/google/callback

spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,read:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
