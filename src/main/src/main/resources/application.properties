
# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:9095}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# ===============================
# DATABASE
# ===============================
# H2 fallback. The mysql profile is active by default for local Run/Debug.
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/shopping-cart;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
