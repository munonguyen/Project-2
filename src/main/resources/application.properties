spring.profiles.active=mysql

api.prefix=/api
server.port=9095

# Spring Cloud Configuration
spring.cloud.compatibility-verifier.enabled=false

# JWT Configuration
jwt.expiration=2592000
jwt.secretKey=T1lH8s5y+1gD9n2cR7wA4kL3pX6zQ8mF0vB9uE7yC1o=
jwt.signerKey=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
jwt.valid-duration=3600
jwt.refreshable-duration=86400

# Google OAuth2 Outbound Configuration
outbound.identity.client-id=${GOOGLE_OUTBOUND_CLIENT_ID:your-outbound-client-id}
outbound.identity.client-secret=${GOOGLE_OUTBOUND_CLIENT_SECRET:your-outbound-client-secret}
outbound.identity.redirect-uri=http://localhost:9095/auth/google/callback

# Spring Security OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,read:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
