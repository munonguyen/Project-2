<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <title>Devon-Building</title>
    <th:block th:replace="~{admin/common/header :: header}"></th:block>
  </head>
  <body class="no-skin" style="font-family: 'Abel', sans-serif">
    <th:block th:replace="~{admin/common/menu :: menu}"></th:block>
    <div class="main-container" id="main-container">
      <script type="text/javascript">
        if (globalThis.ace && globalThis.ace.settings) {
          globalThis.ace.settings.check("main-container", "fixed");
        }
      </script>

      <th:block th:replace="~{admin/common/sidebar :: sidebar}"></th:block>

      <div class="main-content">
        <div class="main-content-inner">
          <div class="breadcrumbs" id="breadcrumbs">
            <script type="text/javascript">
              if (globalThis.ace && globalThis.ace.settings) {
                globalThis.ace.settings.check("breadcrumbs", "fixed");
              }
            </script>

            <ul class="breadcrumb">
              <li>
                <i class="ace-icon fa fa-home home-icon"></i>
                <a href="#">Home</a>
              </li>
              <li class="active">Dashboard</li>
            </ul>
          </div>

          <div class="page-content">
            <div class="page-header">
              <h1>
                Danh sách tòa nhà
                <small>
                  <i class="ace-icon fa fa-angle-double-right"></i>
                  overview &amp; stats
                </small>
              </h1>
            </div>
            <div class="row">
              <div class="col-xs-12">
                <!-- PAGE CONTENT BEGINS -->
                <form
                  class="form-horizontal"
                  method="GET"
                  th:action="@{/admin/buildings/list}"
                  id="building-search-form"
                  th:object="${buildingSearchRequest}"
                >
                  <input
                    type="hidden"
                    id="page"
                    name="page"
                    th:value="${paginationResult != null ? paginationResult.currentPage : 1}"
                  />
                  <input
                    type="hidden"
                    id="maxResult"
                    name="maxResult"
                    th:value="${paginationResult != null ? paginationResult.maxResult : 10}"
                  />
                  <input
                    type="hidden"
                    name="maxNavigationPage"
                    th:value="${paginationResult != null ? paginationResult.navigationPages.size() : 5}"
                  />
                  <div class="widget-box">
                    <div class="widget-header">
                      <h4 class="widget-title">Tìm kiếm</h4>
                      <span class="widget-toolbar">
                        <a href="#" data-action="reload">
                          <i class="ace-icon fa fa-refresh"></i>
                        </a>
                        <a href="#" data-action="collapse">
                          <i class="ace-icon fa fa-chevron-up"></i>
                        </a>
                        <a href="#" data-action="close">
                          <i class="ace-icon fa fa-times"></i>
                        </a>
                      </span>
                    </div>
                    <div class="widget-body">
                      <div class="widget-main">
                        <div class="form-group">
                          <div class="col-xs-12">
                            <div class="col-xs-6">
                              <label for="name">Tên tòa nhà</label>
                              <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Nhập tên tòa nhà"
                                class="form-control"
                                th:value="${buildingSearchRequest.name}"
                              />
                            </div>
                            <div class="col-xs-6">
                              <label for="floorArea">Diện tích sàn</label>
                              <input
                                type="number"
                                id="floorArea"
                                name="floorArea"
                                class="form-control"
                                th:value="${buildingSearchRequest.floorArea}"
                              />
                            </div>
                          </div>
                        </div>
                        <div class="form-group">
                          <div class="col-xs-12">
                            <div class="col-xs-2">
                              <label for="district">Quận</label>
                              <select
                                id="district"
                                name="district"
                                class="form-control"
                              >
                                <option value="">Chọn quận</option>
                                <option
                                  th:each="district : ${districts}"
                                  th:value="${district.key}"
                                  th:text="${district.value}"
                                  th:selected="${buildingSearchRequest.district == district.key}"
                                ></option>
                              </select>
                            </div>
                            <div class="col-xs-5">
                              <label for="ward">Phường</label>
                              <input
                                type="text"
                                id="ward"
                                name="ward"
                                class="form-control"
                                th:value="${buildingSearchRequest.ward}"
                              />
                            </div>
                            <div class="col-xs-5">
                              <label for="street">Đường</label>
                              <input
                                type="text"
                                id="street"
                                name="street"
                                class="form-control"
                                th:value="${buildingSearchRequest.street}"
                              />
                            </div>
                          </div>
                        </div>
                        <div class="form-group">
                          <div class="col-xs-12">
                            <div class="col-xs-4">
                              <label for="numberOfBasement">Số tầng hầm</label>
                              <input
                                type="number"
                                id="numberOfBasement"
                                name="numberOfBasement"
                                class="form-control"
                                th:value="${buildingSearchRequest.numberOfBasement}"
                              />
                            </div>
                            <div class="col-xs-4">
                              <label for="direction">Hướng</label>
                              <input
                                type="text"
                                id="direction"
                                name="direction"
                                class="form-control"
                                th:value="${buildingSearchRequest.direction}"
                              />
                            </div>
                            <div class="col-xs-4">
                              <label for="level">Hạng</label>
                              <input
                                type="text"
                                id="level"
                                name="level"
                                class="form-control"
                                th:value="${buildingSearchRequest.level}"
                              />
                            </div>
                          </div>
                        </div>
                        <div class="form-group">
                          <div class="col-xs-12">
                            <div class="col-xs-3">
                              <label for="rentAreaFrom">Diện tích từ</label>
                              <input
                                type="number"
                                id="rentAreaFrom"
                                name="rentAreaFrom"
                                class="form-control"
                                th:value="${buildingSearchRequest.rentAreaFrom}"
                              />
                            </div>
                            <div class="col-xs-3">
                              <label for="rentAreaTo">Diện tích đến</label>
                              <input
                                type="number"
                                id="rentAreaTo"
                                name="rentAreaTo"
                                class="form-control"
                                th:value="${buildingSearchRequest.rentAreaTo}"
                              />
                            </div>
                            <div class="col-xs-3">
                              <label for="rentPriceFrom">Giá thuê từ</label>
                              <input
                                type="number"
                                id="rentPriceFrom"
                                name="rentPriceFrom"
                                class="form-control"
                                th:value="${buildingSearchRequest.rentPriceFrom}"
                              />
                            </div>
                            <div class="col-xs-3">
                              <label for="rentPriceTo">Giá thuê đến</label>
                              <input
                                type="number"
                                id="rentPriceTo"
                                name="rentPriceTo"
                                class="form-control"
                                th:value="${buildingSearchRequest.rentPriceTo}"
                              />
                            </div>
                          </div>
                        </div>
                        <div class="form-group">
                          <div class="col-xs-12">
                            <div class="col-xs-5">
                              <label for="managerName">Tên quản lí</label>
                              <input
                                type="text"
                                id="managerName"
                                name="managerName"
                                class="form-control"
                                th:value="${buildingSearchRequest.managerName}"
                              />
                            </div>
                            <div class="col-xs-5">
                              <label for="managerPhoneNumber">SĐT quản lí</label>
                              <input
                                type="text"
                                id="managerPhoneNumber"
                                name="managerPhoneNumber"
                                class="form-control"
                                th:value="${buildingSearchRequest.managerPhoneNumber}"
                              />
                            </div>
                            <div class="col-xs-2">
                              <label for="staffId">Chọn nhân viên</label>
                              <select
                                id="staffId"
                                name="staffId"
                                class="form-control"
                              >
                                <option value="">Chọn nhân viên</option>
                                <option
                                  th:each="staff : ${staffs}"
                                  th:value="${staff.key}"
                                  th:text="${staff.value}"
                                  th:selected="${buildingSearchRequest.staffId == staff.key}"
                                ></option>
                              </select>
                            </div>
                          </div>
                        </div>
                        <div class="form-group">
                          <div class="col-xs-12">
                            <div class="col-xs-5" th:each="type : ${rentTypes}">
                              <label th:for="${'typeCode_' + type.key}">
                                <input
                                  type="checkbox"
                                  th:id="${'typeCode_' + type.key}"
                                  name="typeCodes"
                                  th:value="${type.key}"
                                  th:checked="${buildingSearchRequest.typeCodes != null and buildingSearchRequest.typeCodes.contains(type.key)}"
                                />
                                <span th:text="${type.value}"></span>
                              </label>
                            </div>
                          </div>
                        </div>
                        <div class="form-group">
                          <div class="col-xs-12">
                            <div class="col-xs-6">
                              <button
                                type="submit"
                                class="btn btn-sm btn-success"
                                id="btnSearchBuilding"
                              >
                                <i
                                  class="ace-icon glyphicon glyphicon-search"
                                ></i>
                                Tìm kiếm
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </form>
                <div class="row">
                  <div class="col-xs-12">
                    <div class="clearfix">
                      <div class="pull-right">
                        <a
                          th:href="@{/admin/buildings/edit}"
                          id="btnAddNew"
                          type="button"
                          class="btn btn-app btn-success btn-sm"
                          title="Thêm tòa nhà"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="22"
                            height="22"
                            fill="currentColor"
                            class="bi bi-building-add"
                            viewBox="0 0 16 16"
                          >
                            <path
                              d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0"
                            />
                            <path
                              d="M2 1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6.5a.5.5 0 0 1-1 0V1H3v14h3v-2.5a.5.5 0 0 1 .5-.5H8v4H3a1 1 0 0 1-1-1z"
                            />
                            <path
                              d="M4.5 2a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm-6 3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm-6 3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z"
                            />
                          </svg>
                        </a>
                        <button
                          id="btnDeleteBuildings"
                          type="button"
                          class="btn btn-app btn-danger btn-sm"
                          title="Xóa tòa nhà"
                        >
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="22"
                            height="22"
                            fill="currentColor"
                            class="bi bi-building-dash"
                            viewBox="0 0 16 16"
                          >
                            <path
                              d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M11 12h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1 0-1"
                            />
                            <path
                              d="M2 1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6.5a.5.5 0 0 1-1 0V1H3v14h3v-2.5a.5.5 0 0 1 .5-.5H8v4H3a1 1 0 0 1-1-1z"
                            />
                            <path
                              d="M4.5 2a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm-6 3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm-6 3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z"
                            />
                          </svg>
                        </button>
                      </div>
                    </div>
                    <div class="space-14"></div>

                    <div class="table-responsive">
                      <table
                        id="buildingList"
                        class="table table-striped table-bordered table-hover"
                      >
                        <thead>
                          <tr>
                            <th class="center" style="width: 45px">
                              <label class="pos-rel">
                                <input
                                  type="checkbox"
                                  class="ace"
                                  id="checkAll"
                                  aria-label="Chọn tất cả tòa nhà"
                                />
                                <span class="lbl"></span>
                                <span class="sr-only">Chọn tất cả tòa nhà</span>
                              </label>
                            </th>
                            <th>Tên tòa nhà</th>
                            <th>Địa chỉ</th>
                            <th>Số tầng hầm</th>
                            <th>Tên quản lí</th>
                            <th>SĐT quản lí</th>
                            <th>Diện tích sàn</th>
                            <th>Diện tích thuê</th>
                            <th>Diện tích trống</th>
                            <th>Giá thuê</th>
                            <th>Phí dịch vụ</th>
                            <th>Phí môi giới</th>
                            <th class="center" style="width: 120px">Thao tác</th>
                          </tr>
                        </thead>

                        <tbody>
                          <tr th:each="building: ${buildingList}">
                            <td class="center">
                              <label class="pos-rel">
                                <input
                                  type="checkbox"
                                  class="ace check-box-element"
                                  th:value="${building.id}"
                                  aria-label="Chọn tòa nhà"
                                />
                                <span class="lbl"></span>
                                <span class="sr-only">Chọn tòa nhà</span>
                              </label>
                            </td>
                            <td th:text="${building.name}"></td>
                            <td th:text="${building.address}"></td>
                            <td th:text="${building.numberOfBasement}"></td>
                            <td th:text="${building.managerName}"></td>
                            <td th:text="${building.managerPhoneNumber}"></td>
                            <td th:text="${building.floorArea}"></td>
                            <td th:text="${building.rentArea}"></td>
                            <td th:text="${building.emptyArea}"></td>
                            <td th:text="${building.rentPrice}"></td>
                            <td th:text="${building.serviceFee}"></td>
                            <td th:text="${building.brokerageFee}"></td>
                            <td class="center">
                              <div class="btn-group">
                                <button
                                  type="button"
                                  class="btn btn-xs btn-success"
                                  title="Xem chi tiết"
                                  th:onclick="|assignBuilding(${building.id})|"
                                >
                                  <i class="ace-icon fa fa-users"></i>
                                </button>
                                <a
                                  th:href="@{/admin/buildings/{id}/update(id=${building.id})}"
                                  class="btn btn-xs btn-info"
                                  title="Sửa thông tin toà nhà"
                                >
                                  <i
                                    class="ace-icon glyphicon glyphicon-pencil"
                                  ></i>
                                </a>
                                <button
                                  type="button"
                                  class="btn btn-xs btn-danger"
                                  title="Xóa"
                                  th:onclick="|deleteBuilding(${building.id})|"
                                >
                                  <i
                                    class="ace-icon glyphicon glyphicon-trash"
                                  ></i>
                                </button>
                              </div>
                            </td>
                          </tr>
                          <tr th:if="${#lists.isEmpty(buildingList)}">
                            <td colspan="13" class="center text-muted">
                              Chưa có dữ liệu tòa nhà
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <div
                      class="text-center"
                      th:if="${paginationResult != null and paginationResult.totalPages > 1}"
                      style="margin-top: 16px"
                    >
                      <th:block th:each="pageNumber : ${paginationResult.navigationPages}">
                        <a
                          th:if="${pageNumber != -1}"
                          href="#"
                          th:onclick="|goToPage(${pageNumber}); return false;|"
                          th:text="${pageNumber}"
                          th:classappend="${pageNumber == paginationResult.currentPage} ? ' btn btn-primary btn-sm' : ' btn btn-default btn-sm'"
                          style="margin: 0 4px"
                        ></a>
                        <span
                          th:if="${pageNumber == -1}"
                          class="btn btn-default btn-sm disabled"
                          style="margin: 0 4px"
                        >
                          ...
                        </span>
                      </th:block>
                    </div>
                  </div>
                </div>
                <!-- PAGE CONTENT ENDS -->
              </div>
            </div>
            <!-- /.page-content -->
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      tabindex="-1"
      id="assignBuildingModal"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="close"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span aria-hidden="true">&times;</span>
            </button>
            <h5 class="modal-title">Danh sách nhân viên</h5>
          </div>
          <div class="modal-body">
            <input type="hidden" id="buildingId" />
            <table
              id="staffList"
              class="table table-striped table-bordered table-hover"
            >
              <thead>
                <tr>
                  <th class="center" style="width: 45px">
                    <label class="pos-rel">
                      <input
                        type="checkbox"
                        class="ace"
                        id="checkAllStaff"
                        aria-label="Chọn tất cả nhân viên"
                      />
                      <span class="lbl"></span>
                      <span class="sr-only">Chọn tất cả nhân viên</span>
                    </label>
                  </th>
                  <th class="center">Tên nhân viên</th>
                </tr>
              </thead>
              <tbody>

              </tbody>
            </table>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              id="btnAssignBuilding"
            >
              Giao tòa nhà
            </button>
            <button
              type="button"
              class="btn btn-secondary btn-default"
              data-dismiss="modal"
            >
              Hủy
            </button>
          </div>
        </div>
      </div>
    </div>
    <th:block th:replace="~{admin/common/footer :: footer}"></th:block>
    <th:block th:replace="~{admin/common/common-scripts :: jquery}"></th:block>

    <script type="text/javascript">
      const buildingCheckboxSelector = ".check-box-element";
      const staffCheckboxSelector = ".staff-check-box-element";

      function goToPage(page) {
        $("#page").val(page);
        $("#building-search-form").submit();
      }

      function assignBuilding(buildingId) {
        $("#buildingId").val(buildingId);
        $("#checkAllStaff").prop("checked", false);
        $(staffCheckboxSelector).prop("checked", false);
        $("#assignBuildingModal").modal("show");
        loadStaff(buildingId);
      }

      function loadStaff(buildingId) {
        $.ajax({
          type: "GET",
          url: "/api/buildings/" + buildingId + "/staffs",
          timeout: 10000,
          dataType: "json",
          success: function (response) {
            let row = "";
            $.each(response.data, function (_, staff) {
              row += "<tr>";
              row += '<td class="center">';
              row +=
                '<label class="pos-rel"><input type="checkbox" class="ace staff-check-box-element" value="' +
                staff.id +
                '" ' +
                staff.checked +
                ' aria-label="Chọn nhân viên"><span class="lbl"></span><span class="sr-only">Chọn nhân viên</span></label>';
              row += "</td>";
              row += '<td class="center">' + staff.userName + "</td>";
              row += "</tr>";
            });
            $("#staffList tbody").html(row);
            syncCheckAllStaff();
          },
          error: function (jqXHR, textStatus, errorThrown) {
            handleBuildingApiError(
              jqXHR,
              textStatus,
              errorThrown,
              "Không tải được danh sách nhân viên!"
            );
          },
        });
      }

      function confirmAssignBuilding() {
        const buildingId = $("#buildingId").val();
        if (!buildingId) {
          alert("Không tìm thấy tòa nhà");
          return;
        }
        const staffIds = [];
        $('#staffList tbody input[type="checkbox"]:checked').each(function () {
          staffIds.push($(this).val());
        });
        const json = {};
        json.buildingId = buildingId;
        json.staffIds = staffIds;
        sendRequestAssignmentBuilding(json);
      }

      function sendRequestAssignmentBuilding(json) {
        $.ajax({
          url: "/api/buildings/assign",
          type: "PUT",
          data: JSON.stringify(json),
          contentType: "application/json",
          dataType: "json",
          success: function (response) {
            alert(response.message);
          },
          error: function (jqXHR, textStatus, errorThrown) {
            handleBuildingApiError(
              jqXHR,
              textStatus,
              errorThrown,
              "Giao tòa nhà thất bại!"
            );
          },
        });
      }

      function handleBuildingApiError(
        jqXHR,
        textStatus,
        errorThrown,
        defaultMessage
      ) {
        const responseJson = jqXHR.responseJSON || {};
        const details = responseJson.details || responseJson.detail;
        if (details && details.length > 0) {
          alert(details.join("\n"));
          return;
        }

        alert(responseJson.message || defaultMessage || errorThrown || textStatus);
      }


      function syncCheckAllStaff() {
        const total = $(staffCheckboxSelector).length;
        const checked = $(staffCheckboxSelector + ":checked").length;

        $("#checkAllStaff").prop("checked", total > 0 && total === checked);
      }

      function deleteBuilding(buildingId) {
        if (confirm("Bạn có chắc chắn muốn xóa tòa nhà này?")) {
          requestDeleteBuildings([buildingId]);
        }
      }

      function requestDeleteBuildings(selectedBuildingIds) {
        $.ajax({
          type: "DELETE",
          url: "/api/buildings/" + selectedBuildingIds.join(","),
          timeout: 10000,
          dataType: "json",
          success: function () {
            alert("Xóa tòa nhà thành công!");
            globalThis.location.href = "/admin/buildings/list";
          },
          error: function (jqXHR, textStatus, errorThrown) {
            handleBuildingApiError(
              jqXHR,
              textStatus,
              errorThrown,
              "Xóa tòa nhà thất bại!"
            );
          },
        });
      }

      globalThis.assignBuilding = assignBuilding;
      globalThis.deleteBuilding = deleteBuilding;

      $("#checkAll").on("change", function () {
        const isChecked = $(this).prop("checked");
        $(buildingCheckboxSelector).prop("checked", isChecked);
      });

      $(buildingCheckboxSelector).on("change", function () {
        const total = $(buildingCheckboxSelector).length;
        const checked = $(buildingCheckboxSelector + ":checked").length;

        $("#checkAll").prop("checked", total > 0 && total === checked);
      });

      $("#checkAllStaff").on("change", function () {
        const isChecked = $(this).prop("checked");
        $(staffCheckboxSelector).prop("checked", isChecked);
      });

      $("#staffList").on("change", staffCheckboxSelector, function () {
        syncCheckAllStaff();
      });

      $(document).ready(function () {
        $("#btnSearchBuilding").click(function () {
          $("#building-search-form").submit();
        });

        $("#btnDeleteBuildings").click(function (e) {
          e.preventDefault();
          const selectedBuildingIds = [];
          $('#buildingList tbody input[type="checkbox"]:checked').each(
            function () {
              selectedBuildingIds.push($(this).val());
            },
          );
          if (selectedBuildingIds.length === 0) {
            alert("Vui lòng chọn ít nhất một tòa nhà để xóa.");
            return;
          }

          if (confirm("Bạn có chắc chắn muốn xóa các tòa nhà đã chọn?")) {
            requestDeleteBuildings(selectedBuildingIds);
          }
        });

        $("#btnAssignBuilding").click(function (e) {
          e.preventDefault();
          confirmAssignBuilding();
        });
      });
    </script>
  </body>
</html>
